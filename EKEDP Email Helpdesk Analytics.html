document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

      const active = activeStage === i;\n      return {\n        ...s,\n        onClick: () => this.setState({ activeStage: i }),\n        stageBg: active ? s.color : '#F0F4FF',\n        stageBorder: active ? s.color : '#D0DAEE',\n        stageTxt: active ? '#fff' : '#1E2A6E',\n        stageSubTxt: active ? 'rgba(255,255,255,0.75)' : '#7B8CAA',\n        arrowCol: active ? s.color : '#D0DAEE',\n        convTxt: active ? s.color : '#7B8CAA',\n      };\n    });\n\n    const activeStageData = stages[activeStage];\n\n    const stageColorMap = { Decision:'#E8192C', Consideration:'#B87200', Engagement:'#1E2A6E', Awareness:'#5C6F8A', Retention:'#1E8A4C' };\n    const rawAccounts = (liveData && liveData.accounts && liveData.accounts.length > 0) ? liveData.accounts : derivedAccounts;\n    const accounts = rawAccounts.map((a, i) => {\n      const intent = Number(a.intentScore||a.intent)||0;\n      return {\n        name: a.name||'—', size: typeof a.size==='number' ? a.size.toLocaleString() : (a.size||'—'),\n        intent, stage: a.stage||'—', revenue: a.revenue||'—',\n        intentW: intent+'%', intentCol: intent>=85?'#1E8A4C':intent>=70?'#B87200':'#E8192C',\n        stageBg: stageColorMap[a.stage]||'#1E2A6E',\n        isSelected: selectedAcctIdx===i, rowBg: selectedAcctIdx===i?'#EEF2FF':'transparent',\n        onClick: () => this.setState({ selectedAcctIdx: i }),\n      };\n    });\n\n    const selectedAccount = accounts[selectedAcctIdx] || { name:'—', intent:0, stage:'—', revenue:'—', size:'—', intentCol:'#7B8CAA', stageBg:'#5C6F8A', intentW:'0%' };\n\n    // Computed KPIs from real segments data (or '—' if not loaded)\n    const segTotalNum = segments.reduce((sum, s) => {\n      const n = typeof s.count === 'string' ? parseInt(s.count.replace(/,/g,''),10)||0 : (s.count||0);\n      return sum + n;\n    }, 0);\n    const segTotalSubs    = segments.length > 0 ? segTotalNum.toLocaleString() : '—';\n    const segAvgOpen      = segments.length > 0 ? Math.round(segments.reduce((a,s)=>a+s.open,0)/segments.length) : null;\n    const segAvgClick     = segments.length > 0 ? Math.round(segments.reduce((a,s)=>a+s.click,0)/segments.length) : null;\n    const segAvgOpenStr   = segAvgOpen  !== null ? segAvgOpen  + '%' : '—';\n    const segAvgClickStr  = segAvgClick !== null ? segAvgClick + '%' : '—';\n    const segCount        = segments.length > 0 ? String(segments.length) : '—';\n    const hasSegments     = segments.length > 0;\n    const sidebarTrend    = segments.length > 0 ? '\\u2191 6.8% this quarter' : 'No data loaded yet';\n\n    const isA = selectedVariant === 'A';\n    const isB = selectedVariant === 'B';\n    const isWeekly  = reportView === 'weekly';\n    const isMonthly = reportView === 'monthly';\n\n    // ── All helpdesk + QA data from liveData ──\n    const hd = (liveData && liveData.helpdesk) || {};\n    const wTickets   = hd.totalTickets || 0;\n    const wResponded = hd.responded    || 0;\n    const wEscalated = hd.escalated    || 0;\n    const wReturned  = hd.returned     || 0;\n    const maxTix = Math.max(...((hd.topDistricts||[{tickets:1}]).map(x=>x.tickets)),1);\n    const wCategories = (hd.categories||[]).map(c => ({\n      name: c.name||'—', total: c.total||0, sla: c.withinSLA||0, warn: c.warning||0, breach: c.breach||0,\n      breachCol: (c.breach||0)>5?'#E8192C':(c.breach||0)>0?'#B87200':'#1E8A4C',\n      slaW: c.total ? Math.round(((c.withinSLA||0)/c.total)*100)+'%' : '0%',\n    }));\n    const wDistricts = (hd.topDistricts||[]).map(d => ({ name:d.name||'—', tickets:d.tickets||0, barW:Math.round((d.tickets||0)/maxTix*100)+'%' }));\n    const wResponses = (hd.responsesByCategory||[]).map(r => ({ cat:r.category||'—', count:r.tickets||0, pct:r.pct||'—' }));\n\n    const qaRaw = (liveData && liveData.qa && liveData.qa.districts) || [];\n    const qaDistricts = qaRaw.map(d => ({\n      name:d.name||'—', sample:d.sample||0, omission:d.omission||0, errorRate:d.errorRate||'0%',\n      compliant:d.compliant!==false,\n      stCol:d       topDistrictsSummary: wDistricts.slice(0,5).map(d=>d.name+' ('+d.tickets+')').join(', ') || '—',\n      fullCoverageSummary: wTickets+' tickets actioned: '+wResponded+' responded, '+wEscalated+' escalated, '+wReturned+' returned.',\n      reportPeriod: (liveData && liveData.reportPeriod) || 'Not yet loaded',\n      reportDate: (liveData && liveData.reportDate) || '—',\n      syncUrl: currentSyncUrl,\n      setSyncUrl: (url) => this.setState({ syncUrl: url }),\n      onUrlChange: (e) => this._save({ syncUrl: e.target.value }),\n      clearUrl: () => this.setState({ syncUrl: '' }),\n      openJsonPaste: () => this.setState({ showJsonPaste: true, jsonPasteVal: '' }),\n      closeJsonPaste: () => this.setState({ showJsonPaste: false }),\n      onJsonPasteChange: (e) => this.setState({ jsonPasteVal: e.target.value }),\n      loadJsonPaste: () => {\n        try {\n          const json = JSON.parse(this.state.jsonPasteVal || '{}');\n          const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n          const n = new Date();\n          const t = n.getDate()+' '+mo[n.getMonth()]+' '+n.getFullYear()+', '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');\n          const mapped = json.helpdesk ? json : {\n            reportPeriod: (json.period_start||'') + ' – ' + (json.period_end||''),\n            reportDate: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),\n            segments:[], predictions:[], journey:[], accounts:[],\n            helpdesk: {\n              totalTickets: json.total_assigned||0, responded: json.total_responded||0,\n              escalated: json.total_escalated||0, returned: json.total_returned||0,\n              slaWithin: json.total_sla_met||0, slaBreached: json.total_sla_breached||0,\n              categories: json.categories||[], topDistricts: json.topDistricts||[],\n              responsesByCategory: json.responsesByCategory||[],\n            }\n          };\n          const recs = mapped.helpdesk.totalTickets || 0;\n          const pasteLog = [{time:t, source:'Manual JSON Paste', records:recs, status:'success', duration:'—'},...this.state.syncLog];\n          this._save({ liveData: mapped, syncLog: pasteLog });\n          this.setState({ showJsonPaste: false, jsonPasteVal: '' });\n        } catch(e) { alert('Invalid JSON — please copy the full response from your flow and paste again.'); }\n      },\n      showJsonPaste: !!this.state.showJsonPaste,\n      jsonPasteVal: this.state.jsonPasteVal || '',\n      onCsvImport: (e) => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const reader = new FileReader();\n        reader.onload = (ev) => {\n          try {\n            const text = ev.target.result;\n            // Parse CSV with quoted field support\n            function parseCSV(t) {\n              const rows=[]; let row=[],field='',inQ=false;\n              for(let i=0;i<t.length;i++){\n                const c=t[i],nx=t[i+1];\n                if(inQ){if(c==='\"'&&nx==='\"'){field+='\"';i++;}else if(c==='\"'){inQ=false;}else{field+=c;}}\n                else{if(c==='\"'){inQ=true;}else if(c===','){row.push(field);field='';}\n                else if(c==='\\n'){row.push(field);rows.push(row);row=[];field='';}\n                else if(c!=='\\r'){field+=c;}}\n              }\n              if(row.length){row.push(field);rows.push(row);}\n              return rows;\n            }\n            const allRows = parseCSV(text);\n            const headers = allRows[0];\n            const data = allRows.slice(1).filter(r=>r.length>2).map(r=>{\n              const obj={}; headers.forEach((h,i)=>{obj[h]=(r[i]||'').trim();}); return obj;\n            });\n            // Auto-detect date column — try common names\n            const dateCols = ['ReceivedTime','Created','Date Created','DateCreated','Date','Reported Date','ReportedDate','Created Date','Opened','Open Date'];\n            const dateCol = dateCols.find(c => headers.includes(c)) || headers.find(h => /date|time|created|opened/i.test(h)) || headers[0];\n            // Auto-detect category, status, district columns\n            // Prefer \"Complaint Category\" over \"Category\" (Issue Tracker has both)\n            const catCol  = headers.find(h => /complaint.?category/i.test(h)) || headers.find(h => /^categor/i.test(h)) || headers.find(h => /categor|issue.?type/i.test(h)) || 'Category';\n            const statCol = headers.find(h => /status|state/i.test(h)) || 'Status';\n            const distCol = headers.find(h => /district|business.?unit|bu|location|area/i.test(h)) || 'Business Unit';\n            const slaCol  = headers.find(h => /sla/i.test(h)) || 'SLAStatus';\n            // Parse a date string in various formats\n            function parseDate(s) {\n              if(!s) return null;\n              // ISO: 2026-06-22 or 2026-06-22T...\n              let m = s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);\n              if(m) return new Date(+m[1],+m[2]-1,+m[3]);\n              // US: 6/22/2026\n              m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/);\n              if(m) return new Date(+m[3],+m[1]-1,+m[2]);\n              // UK: 22/06/2026\n              m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{2,4})/);\n              if(m){ const yr=+m[3]<100?(2000+ +m[3]):+m[3]; return new Date(yr,+m[2]-1,+m[1]); }\n              // DD-Mon-YYYY: 22-Jun-2026\n              m = s.match(/^(\\d{1,2})-([A-Za-z]+)-(\\d{4})/);\n              if(m){ const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase()); return mo>=0?new Date(+m[3],mo,+m[1]):null; }\n              return null;\n            }\n            // Detect most recent week in data\n            const dates = data.map(r => parseDate(r[dateCol])).filter(Boolean);\n            const maxDate = dates.length ? new Date(Math.max(...dates.map(d=>d.getTime()))) : new Date();\n            // Find week start (Monday) of most recent date\n            const dow = maxDate.getDay();\n            const diffToMon = (dow===0)?6:dow-1;\n            const weekStart = new Date(maxDate); weekStart.setDate(maxDate.getDate()-diffToMon);\n            const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+4);\n            // Filter to that week\n            // Extend window to full 7 days (Mon–Sun) so Saturday entries aren't excluded\n            const weekEndSun = new Date(weekStart); weekEndSun.setDate(weekStart.getDate()+6);\n            const week = dates.length\n              ? data.filter(r => { const d=parseDate(r[dateCol]); return d && d>=weekStart && d<=weekEndSun; })\n              : data; // no date column — use everything\n            if(!week.length){\n              week.push(...data);\n            }\n            if(!week.length){ alert('CSV appears empty — no rows found.'); return; }\n            // Detect mode: Issue Tracker (Pending/Assigned statuses) vs Email Helpdesk (Responded/Escalated statuses)\n            const isIssueTracker = week.some(r => /pending|assigned|processing/i.test(r[statCol]||'')) &&\n                                   !week.some(r => /respond|escalat/i.test(r[statCol]||''));\n            const isResponded  = r => /respond/i.test(r[statCol]||'');\n            const isEscalated  = r => isIssueTracker ? true : /escalat/i.test(r[statCol]||'');\n            const isReturned   = r => /return|awaiting|customer.*response/i.test(r[statCol]||'');\n            const isClosed     = r => /closed|resolved|done/i.test(r[statCol]||'');\n            const total     = week.length;\n            const responded = isIssueTracker ? week.filter(isClosed).length : week.filter(isResponded).length;\n            const escalated = isIssueTracker ? total : week.filter(isEscalated).length;\n            const returned  = week.filter(isReturned).length;\n            const slaWithin  = week.filter(r=>/within|met|on.?time/i.test(r[slaCol]||'')).length;\n            const slaBreached= week.filter(r=>/breach|missed|overdue/i.test(r[slaCol]||'')).length;\n            // Categories\n            const catMap={};\n            week.forEach(r=>{\n              const c=r[catCol]||'Other', s=r[slaCol]||'';\n              if(!catMap[c])catMap[c]={name:c,total:0,withinSLA:0,warning:0,breach:0};\n              catMap[c].total++;\n              if(/within|met|on.?time/i.test(s))catMap[c].withinSLA++;\n              else if(/warn/i.test(s))catMap[c].warning++;\n              else if(/breach|missed|overdue/i.test(s))catMap[c].breach++;\n            });\n            const categories = Object.values(catMap).sort((a,b)=>b.total-a.total);\n            // Districts — all rows for Issue Tracker, escalated only for Helpdesk\n            const distMap={};\n            const distRows = escalated > 0 ? week.filter(isEscalated) : week;\n            distRows.forEach(r=>{\n              const d=r[distCol]||'Unknown'; distMap[d]=(distMap[d]||0)+1;\n            });\n            const topDistricts = Object.entries(distMap).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([name,tickets])=>({name,tickets}));\n            // Responses by category\n            const respMap={};\n            const respRows = responded > 0 ? week.filter(isResponded) : week;\n            respRows.forEach(r=>{\n              const c=r[catCol]||'Other'; respMap[c]=(respMap[c]||0)+1;\n            });\n            const responsesByCategory = Object.entries(respMap).sort((a,b)=>b[1]-a[1]).map(([cat,tickets])=>({\n              category:cat, tickets, pct: Math.round(tickets/(respRows.length||1)*100)+'%'\n            }));\n            // Format period\n            const fmt=(d)=>d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();\n            const period = fmt(weekStart)+' – '+fmt(weekEnd);\n            const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n            const n=new Date();\n            const stamp=n.getDate()+' '+mo[n.getMonth()]+' '+n.getFullYear()+', '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');\n            let mapped;\n            if (isIssueTracker && this.state.liveData) {\n              // Issue Tracker: ONLY patch escalated count + districts into existing data\n              const existing = this.state.liveData;\n              const existingHD = existing.helpdesk || {};\n              mapped = {\n                ...existing,\n                isIssueTracker: false, // reset so KPI labels stay as Helpdesk labels\n                helpdesk: {\n                  ...existingHD,\n                  escalated: total,\n                  topDistricts,\n                }\n              };\n            } else {\n              // Full replace (Helpdesk CSV or first import)\n              mapped = {\n                reportPeriod: period, reportDate: fmt(new Date()),\n                isIssueTracker,\n                segments:[], predictions:[], journey:[], accounts:[],\n                helpdesk:{ totalTickets:total, responded, escalated, returned, slaWithin, slaBreached, categories, topDistricts, responsesByCategory }\n              };\n            }\n            const srcLabel = isIssueTracker ? 'Issue Tracker CSV ('+file.name+')' : 'CSV Import ('+file.name+')';\n            const csvLog = [{time:stamp,source:srcLabel,records:total,status:'success',duration:'—'},...this.state.syncLog];\n            this._save({ liveData:mapped, syncLog:csvLog });\n          } catch(err){ alert('CSV parse error: '+err.message); }\n        };\n        reader.readAsText(file);\n        e.target.value = '';\n      },\n      clearLog: () => this.setState({ syncLog: [] }),\n      // Connection Status — dynamic based on real state\n      hasUrl: !!(currentSyncUrl && !currentSyncUrl.includes('your-endpoint')),\n      lastPullOk: rawSyncLog.length > 0 && rawSyncLog[0].status === 'success',\n      lastPullFailed: rawSyncLog.length > 0 && rawSyncLog[0].status !== 'success',\n      noPullYet: rawSyncLog.length === 0,\n      spStatus: rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '✓ Live' : rawSyncLog.length > 0 ? '⚠ Check flow' : '— Unknown',\n      spStatusBg: rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '#EFFFF4' : rawSyncLog.length > 0 ? '#FFFBEF' : '#F4F7FF',\n      spStatusCol: rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '#1E8A4C' : rawSyncLog.length > 0 ? '#B87200' : '#7B8CAA',\n      paStatus: (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? (rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '✓ Active' : rawSyncLog.length > 0 ? '⚠ Error' : '⚙ URL set') : '— Not configured',\n      paStatusBg: (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? (rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '#EFFFF4' : rawSyncLog.length > 0 ? '#FFF0F0' : '#F4F7FF') : '#F4F7FF',\n      paStatusCol: (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? (rawSyncLog.length > 0 && rawSyncLog[0].status === 'success' ? '#1E8A4C' : rawSyncLog.length > 0 ? '#E8192C' : '#1E2A6E') : '#7B8CAA',\n      appStatus: liveData ? '✓ Data loaded' : (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? '⚙ Ready to pull' : '⚙ Awaiting URL',\n      appStatusBg: liveData ? '#EFFFF4' : (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? '#EEF2FF' : '#FFFBEF',\n      appStatusCol: liveData ? '#1E8A4C' : (currentSyncUrl && !currentSyncUrl.includes('your-endpoint')) ? '#1E2A6E' : '#B87200',\n      lastSync: rawSyncLog[0] ? rawSyncLog[0].time : 'Never',\n      syncLogCount: rawSyncLog.length,\n      syncLog: rawSyncLog.map(e => {\n        const sM = { success:{bg:'#EFFFF4',col:'#1E8A4C',label:'Success'}, warning:{bg:'#FFFBEF',col:'#B87200',label:'Warning'}, error:{bg:'#FFF0F0',col:'#E8192C',label:'Error'} };\n        const cM = { 'HTTP API':'#1E2A6E', 'Power Automate':'#742774', 'Google Sheets':'#1E8A4C', 'Manual CSV':'#5C6F8A' };\n        const sKey = typeof e.status === 'string' ? (e.status.startsWith('error') ? 'error' : e.status.startsWith('warn') ? 'warning' : 'success') : 'success';\n        const sm = sM[sKey] || sM.error;\n        const statusLabel = sKey === 'error' && e.status !== 'error' ? (e.status.replace('error — ','').substring(0,40)) : sm.label;\n        return { ...e, statusBg: sm.bg, statusCol: sm.col, statusLabel, sourceCol: cM[e.source] || '#7B8CAA' };\n      }),\n      pullBtnBg:    isSyncing ? '#5C6F8A' : '#1E2A6E',\n      pullBtnLabel: isSyncing ? 'Pulling data...' : 'Pull Now',\n      pullBtnIcon:  isSyncing ? '⟳' : '↓',\n      pullData: () => {\n        if (this.state.isSyncing) return;\n        const url = this.state.syncUrl || '';\n        if (!url || url.includes('your-endpoint')) { alert('Paste your Power Automate HTTP trigger URL first.'); return; }\n        this.setState({ isSyncing: true });\n        const t0 = Date.now();\n        const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n        const stamp = () => { const n=new Date(); return n.getDate()+' '+mo[n.getMonth()]+' '+n.getFullYear()+', '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); };\n        // Safety timeout — always unblock button after 15s\n        const safetyTimer = setTimeout(() => {\n          this.setState(s => ({ isSyncing:false, syncLog:[{time:stamp(),source:'Power Automate',records:0,status:'error — Timeout (15s). Check URL or CORS settings.',duration:'15s'},...s.syncLog] }));\n        }, 15000);\n        fetch(url, { method: 'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ source: 'EKEDP-App' }) })\n          .then(r => { clearTimeout(safetyTimer); if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (r.status===401?'Unauthorised: switch flow to anonymous auth':r.status===403?'Forbidden: check flow permissions':r.statusText)); return r.json(); })\n          .then(json => {\n            const dur = ((Date.now()-t0)/1000).toFixed(1)+'s';\n            // Format ISO date as \"22 Jun 2026\"\n            const fmtISO = (iso) => { if(!iso)return '—'; const d=new Date(iso); const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear(); };\n            // Map Power Automate flat format → app nested format\n            const mapped = json.helpdesk ? json : {\n              reportPeriod: fmtISO(json.period_start) + ' \\u2013 ' + fmtISO(json.period_end),\n              reportDate: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),\n              segments:[], predictions:[], journey:[], accounts:[],\n              helpdesk: {\n                totalTickets: json.total_assigned  || 0,\n                responded:    json.total_responded || 0,\n                escalated:    json.total_escalated || 0,\n                returned:     json.total_returned  || 0,\n                slaWithin:    json.total_sla_met   || 0,\n                slaBreached:  json.total_sla_breached || 0,\n                pending:      json.total_pending   || 0,\n                categories:   json.categories   || [],\n                topDistricts: json.topDistricts || [],\n                responsesByCategory: json.responsesByCategory || [],\n              }\n            };\n            const recs = mapped.helpdesk.totalTickets || 0;\n            // Store raw response for debugging\n            this._lastRawResponse = json;\n            const newLog = [{time:stamp(),source:'Power Automate',records:recs,status:'success',duration:dur},...this.state.syncLog];\n            this._save({ liveData:mapped, syncLog:newLog });\n            this.setState({ isSyncing:false, lastRawJson: JSON.stringify(json, null, 2) });\n          })\n          .catch((err) => {\n            clearTimeout(safetyTimer);\n            const msg = (err && err.message) ? err.message : 'Network/CORS error — switch flow trigger auth to Anonymous.';\n            const errLog = [{time:stamp(),source:'Power Automate',records:0,status:'error — '+msg,duration:'—'},...this.state.syncLog];\n            this._save({ syncLog: errLog });\n            this.setState({ isSyncing:false, lastPullError: msg });\n          });\n      },\n      exportWord: () => {\n        if (!window.htmlDocx) { alert('Export library not yet loaded — please try again in a moment.'); return; }\n        // Route to comprehensive helper (wordExport.js)\n        if (window.buildEKEDPReport) {\n          const prevHD = (this.state.prevData && this.state.prevData.helpdesk) || null;\n          window.buildEKEDPReport({\n            segments, predictions, stages: stagesData, accounts,\n            reportPeriod: (liveData && liveData.reportPeriod) || '—',\n            reportDate:   (liveData && liveData.reportDate)   || new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),\n            prevHelpdesk: prevHD,\n            helpdesk: {\n              totalTickets: wTickets, responded: wResponded, escalated: wEscalated, returned: wReturned,\n              slaWithin:   (liveData && liveData.helpdesk && liveData.helpdesk.slaWithin)   || 0,\n              slaBreached: (liveData && liveData.helpdesk && liveData.helpdesk.slaBreached) || 0,\n              categories:   wCategories.map(c=>({name:c.name,total:c.total,withinSLA:c.withinSLA||c.within||0,warning:c.warning||0,breach:c.breach||0})),\n              topDistricts: wDistricts.map(d=>({name:d.name,tickets:d.tickets})),\n              responsesByCategory: wResponses.map(r=>({category:r.cat,tickets:r.count,pct:r.pct})),\n            }\n          });\n          return;\n        }\n\n        const css = `\n          body{font-family:Calibri,Arial,sans-serif;font-size:11pt;margin:0;padding:0;color:#000;}\n          .right{text-align:right;} .center{text-align:center;}\n          h1{font-size:15pt
