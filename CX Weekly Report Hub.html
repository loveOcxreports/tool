function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function loadPersisted() {
  try {
    const d = localStorage.getItem('ehd_liveData');
    const m = localStorage.getItem('ehd_mobileData');
    const lc = localStorage.getItem('ehd_liveChatData');
    const s = localStorage.getItem('ehd_settings');
    if (d) state.liveData = JSON.parse(d);
    if (m) state.mobileData = JSON.parse(m);
    if (lc) state.liveChatData = JSON.parse(lc);
    const amb = localStorage.getItem('ehd_ambassadorData');
    if (amb) state.ambassadorData = JSON.parse(amb);
    if (s) state.settings = { ...state.settings, ...JSON.parse(s) };
  } catch (e) {}
}

function toast(msg, ms) {
  ms = ms || 3500;
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => setState({ showToast: false }), ms);
  setState({ toastMsg: msg, showToast: true });
}

function saveSetting(patch) {
  const settings = { ...state.settings, ...patch };
  setState({ settings });
  try { localStorage.setItem('ehd_settings', JSON.stringify(settings)); } catch (e) {}
}

function saveData(liveData) {
  setState({ liveData });
  try { localStorage.setItem('ehd_liveData', JSON.stringify(liveData)); } catch (e) {}
}

function saveMobileData(mobileData) {
  setState({ mobileData });
  try { localStorage.setItem('ehd_mobileData', JSON.stringify(mobileData)); } catch (e) {}
}

function saveLiveChatData(liveChatData) {

function hourIndexFromLabel(label) {
  const m = String(label || '').trim().match(/^(\d{1,2})\s*(AM|PM)/i);
  if (!m) return -1;
  let h = parseInt(m[1], 10) % 12;
  if (/PM/i.test(m[2])) h += 12;
  return h;
}

function analyseHourly(hours) {
  const sum = (a, b) => hours.slice(a, b).reduce((t, v) => t + v, 0);
  const total = sum(0, 24);
  const night = sum(0, 6);
  const early = sum(6, 8);
  const core = sum(8, 17);
  const evening = sum(17, 22);
  const late = sum(22, 24);
  const outside = total - core;
  let peakHour = 0;
  for (let i = 1; i < 24; i++) if (hours[i] > hours[peakHour]) peakHour = i;
  const pct = (n) => total ? Math.round(n / total * 100) : 0;
  return {
    hours, total,
    night, early, core, evening, late, outside,
    nightPct: pct(night), earlyPct: pct(early), corePct: pct(core),
    eveningPct: pct(evening), latePct: pct(late), outsidePct: pct(outside),
    peakHour, peakCount: hours[peakHour], peakPct: pct(hours[peakHour])
  };
}

function hourLabel(h) {
  const ampm = h < 12 ? 'AM' : 'PM';
  const hh = h % 12 === 0 ? 12 : h % 12;
  const nh = (h + 1) % 24;
  const nampm = nh < 12 ? 'AM' : 'PM';
  const nhh = nh % 12 === 0 ? 12 : nh % 12;
  return hh + ' ' + ampm + ' \u2013 ' + nhh + ' ' + nampm;
}

function processLiveChatHourlyCSV(text) {
  const rows = parseCSV(text);
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    const joined = rows[i].join(',').toLowerCase();
    if (/range/.test(joined) && (/responsive/.test(joined) || /proactive/.test(joined))) { headerIdx = i; break; }
  }
  if (headerIdx === -1) { toast('\u26a0\ufe0f Could not find a Range / Responsive / Proactive header row'); return; }

  const header = rows[headerIdx].map(c => c.trim().toLowerCase());
  const rangeCol = header.findIndex(c => /range|hour|time/.test(c));
  const respCol = header.findIndex(c => /responsive/.test(c));
  const proCol = header.findIndex(c => /proactive/.test(c));
  if (rangeCol === -1) { toast('\u26a0\ufe0f No time range column found'); return; }

  const hours = new Array(24).fill(0);
  let responsive = 0, proactive = 0, matched = 0;
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const h = hourIndexFromLabel(r[rangeCol]);
    if (h < 0) continue;
    const rv = respCol > -1 ? (parseInt(r[respCol], 10) || 0) : 0;
    const pv = proCol > -1 ? (parseInt(r[proCol], 10) || 0) : 0;
    hours[h] += rv + pv;
    responsive += rv; proactive += pv; matched++;
  }
  if (!matched) { toast('\u26a0\ufe0f No hourly rows could be read from that file'); return; }

  const a = analyseHourly(hours);
  a.responsive = responsive;
  a.proactive = proactive;

  const existing = state.liveChatData || {};
  saveLiveChatData(Object.assign({}, existing, { hourly: a }));
  toast('\u2705 Hourly volume imported \u00b7 ' + a.total + ' conversations across ' + matched + ' hours');
}

function ambNum(v) {

function processAmbassadorXlsx(arrayBuffer) {
  if (!window.XLSX) { toast('\u26a0\ufe0f Spreadsheet library still loading \u2014 try again in a moment'); return; }
  var wb = window.XLSX.read(arrayBuffer, { type: 'array' });
  var ws = wb.Sheets[wb.SheetNames[0]];
  var rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  if (!rows.length) { toast('\u26a0\ufe0f That sheet looks empty'); return; }

  var headerIdx = -1, hdr = [];
  for (var i = 0; i < rows.length; i++) {
    var joined = rows[i].join('|').toLowerCase();
    if (/name/.test(joined) && /sign.?up/.test(joined)) { headerIdx = i; hdr = rows[i].map(function (c) { return String(c).toLowerCase().trim(); }); break; }
  }
  if (headerIdx === -1) { toast('\u26a0\ufe0f Could not find a Name / Sign-Ups header row'); return; }

  var nameCol = hdr.findIndex(function (c) { return /name/.test(c); });
  var codeCol = hdr.findIndex(function (c) { return /referral code/.test(c); });
  var signCols = []; hdr.forEach(function (c, i) { if (/sign.?up/.test(c)) signCols.push(i); });
  var txnCols = []; hdr.forEach(function (c, i) { if (/transaction/.test(c)) txnCols.push(i); });

  var signPrevCol = signCols.length > 1 ? signCols[0] : (signCols[0] != null ? signCols[0] : -1);
  var signNowCol = signCols.length > 1 ? signCols[signCols.length - 1] : signCols[0];
  var txnPrevCol = txnCols.length > 1 ? txnCols[0] : -1;
  var txnNowCol = txnCols.length ? txnCols[txnCols.length - 1] : -1;

  var list = [];
  var signPrev = 0, signNow = 0, txnPrev = 0, txnNow = 0;
  for (var r = headerIdx + 1; r < rows.length; r++) {
    var row = rows[r];
    var name = String(row[nameCol] || '').trim();
    if (!name) continue;
    if (/^total$/i.test(name)) continue;
    var sp = signPrevCol > -1 ? ambNum(row[signPrevCol]) : 0;
    var sn = signNowCol > -1 ? ambNum(row[signNowCol]) : 0;
    var tp = txnPrevCol > -1 ? ambNum(row[txnPrevCol]) : 0;
    var tn = txnNowCol > -1 ? ambNum(row[txnNowCol]) : 0;
    list.push({ name: name, code: codeCol > -1 ? String(row[codeCol] || '').trim() : '', signPrev: sp, signNow: sn, txnPrev: tp, txnNow: tn });
    signPrev += sp; signNow += sn; txnPrev += tp; txnNow += tn;
  }
  if (!list.length) { toast('\u26a0\ufe0f No ambassador rows could be read'); return; }

  var active = list.filter(function (a) { return a.signNow > 0; }).length;
  var zeroTxn = list.filter(function (a) { return a.txnNow === 0; }).length;
  var top10 = list.slice().sort(function (a, b) { return b.txnNow - a.txnNow; }).slice(0, 10);

  saveAmbassadorData({
    count: list.length, active: active, inactive: list.length - active, zeroTxn: zeroTxn,
    signPrev: signPrev, signNow: signNow, txnPrev: txnPrev, txnNow: txnNow,
    list: list, top10: top10
  });
  toast('\u2705 Ambassador dashboard imported \u00b7 ' + list.length + ' ambassadors');
}

// CSV / DATE HELPERS
// ============================================================
function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim()));
}

function parseDate(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s);
  const dmy = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if (dmy) return new Date(+dmy[3], +dmy[2] - 1, +dmy[1]);
  const mdy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (mdy) return new Date(+mdy[3], +mdy[1] - 1, +mdy[2]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function detectWeekBounds(rows, dateCol) {
  if (!dateCol) return null;
  const now = new Date();
  const dates = rows.map(r => parseDate(r[dateCol])).filter(d => d && d <= now);
  if (!dates.length) return null;
  const maxD = new Date(Math.max(...dates.map(d => d.getTime())));
  const dow = maxD.getDay();
  const start = new Date(maxD); start.setDate(maxD.getDate() - (dow === 0 ? 6 : dow - 1)); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23, 59, 59, 999);
  return { start, end };
}

function drawPieChart(categories) {
  try {
    const size = 240;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const total = categories.reduce((a, c) => a + c.count, 0) || 1;
    let start = -Math.PI / 2;
    const cx = size / 2, cy = size / 2, r = size / 2 - 4;
    categories.forEach(c => {
      const angle = (c.count / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = c.color;
      ctx.fill();
      start += angle;
    });
    return canvas.toDataURL('image/png');
  } catch (e) { return ''; }
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function drawBox(ctx, x, y, w, h, fill, stroke, label, labelColor, fontSize) {
  roundRectPath(ctx, x, y, w, h, 10);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = labelColor || '#1E3070';
  ctx.font = (fontSize || 13) + 'px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lines = wrapText(ctx, label, w - 24);
  const lineHeight = (fontSize || 13) + 4;
  const startY = y + h / 2 - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((ln, i) => ctx.fillText(ln, x + w / 2, startY + i * lineHeight));
}

function drawArrow(ctx, x1, y1, x2, y2, color) {
  ctx.strokeStyle = color || '#9AA5C4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = color || '#9AA5C4';
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(angle - Math.PI / 6), y2 - 8 * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - 8 * Math.cos(angle + Math.PI / 6), y2 - 8 * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

function drawArrowLabel(ctx, x, y, text, color) {
  ctx.font = 'bold 11px Arial';
  ctx.fillStyle = color || '#6B7CAF';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
}

function drawTriageFlowchart() {

    // Merge back to center

    // 3. Agent reviews & responds
    drawBox(ctx, cx - boxW / 2, y, boxW, boxH, NAVY, null, 'Agent reviews the complaint\nand responds', WHITE, 13);

    drawArrow(ctx, cx, prevY, cx, y, GREY);

    // 4. Decision: need more info?
    drawBox(ctx, cx - dW / 2, y, dW, dH, LIGHTBLUE, BLUE, 'Does the agent need more\ninfo from the customer?', NAVY, 13);

    drawArrowLabel(ctx, cx - 110, prevY + 22, 'YES', AMBERTX);
    drawArrowLabel(ctx, cx + 110, prevY + 22, 'NO', GREENTX);
    drawArrow(ctx, cx - 50, prevY, leftX + branchW / 2, y, AMBERTX);
    drawArrow(ctx, cx + 50, prevY, rightX + branchW / 2, y, GREENTX);

    const branch2H = 78;
    drawBox(ctx, leftX, y, branchW, branch2H, AMBER, AMBERTX, 'Customer is asked for details.\nTicket waits \u2014 reminders go out\nautomatically if they go quiet', AMBERTX, 12);
    drawBox(ctx, rightX, y, branchW, branch2H, GREEN, GREENTX, 'Agent has what they need \u2014\nmoves straight to resolving it', GREENTX, 12);
    const branchBottomY2 = y + branch2H;
    y += branch2H + gap;

    drawArrow(ctx, leftX + branchW / 2, branchBottomY2, cx, y, GREY);
    drawArrow(ctx, rightX + branchW / 2, branchBottomY2, cx, y, GREY);

    // 5. Decision: needs field work?
    drawBox(ctx, cx - dW / 2, y, dW, dH, LIGHTBLUE, BLUE, 'Does this need someone on\nthe ground to fix it?', NAVY, 13);

    drawBox(ctx, rightX, y, branchW, branchH, GREEN, GREENTX, 'Marked resolved \u2014 customer\ngets a closing email', GREENTX, 12);

// ============================================================
// CSV PROCESSING — Email Helpdesk / Issue Tracker
// ============================================================
function processCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('⚠️ CSV appears empty'); return; }
  const headers = rows[0].map(h => h.trim());
  const data = rows.slice(1).map(r => {
    const obj = {}; headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); }); return obj;
  });

  const find = patterns => headers.find(h => patterns.some(p => p.test(h))) || '';
  const catCol = find([/^category$/i, /complaint.*type/i, /complaint.*category/i, /issue.*type/i, /request.*type/i, /^type$/i]);
  const slaCol = find([/sla.*status/i, /^sla$/i, /sla.*breach/i]);
  const statCol = find([/^status$/i, /complaint.*status/i]);
  const assignCol = find([/assigned.*to/i, /^assignee$/i]);
  const dateCol = find([/assigned.*date/i, /received.*time/i, /created/i, /^date$/i]);

  const isPending = r => /awaiting.*customer/i.test(r[statCol] || '');

  let week = data;
  if (assignCol) week = data.filter(r => (r[assignCol] || '').trim() !== '');

  const total = week.length;
  const pending = week.filter(isPending).length;
  const resolved = total - pending;

  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt = d => d.getDate() + ' ' + mo[d.getMonth()] + ' ' + d.getFullYear();
  const bounds = detectWeekBounds(week, dateCol);
  const period = bounds ? fmt(bounds.start) + ' \u2013 ' + fmt(bounds.end) : '\u2014';
  const today = new Date();
  const reportDate = today.getDate() + ' ' + mo[today.getMonth()] + ' ' + today.getFullYear();

  const buCol = find([/business.*unit/i, /district/i, /^bu$/i, /location/i]);
  const isEscalated = r => /escalated.*district/i.test(r[statCol] || '');

  const isIssueTrackerCSV = headers.some(h => /responsible.*party/i.test(h)) ||
    headers.some(h => /meter.*no/i.test(h)) ||
    headers.some(h => /customer.*name/i.test(h) && !headers.some(hh => /SLAStatus/i.test(hh))) ||
    data.some(r => /^(pending|assigned)$/i.test(r[statCol] || ''));

  const catMap = {}, distMap = {};

  if (isIssueTrackerCSV) {
    const existing = state.liveData || {};
    data.forEach(r => {
      const bu = (r[buCol] || '').trim();
      if (!bu) return;
      if (!distMap[bu]) distMap[bu] = { name: bu, count: 0 };
      distMap[bu].count++;
    });
    const escalatedDistricts = Object.values(distMap).sort((a, b) => a.name.localeCompare(b.name));
    const totalEscalated = escalatedDistricts.reduce((a, d) => a + d.count, 0);
    saveData({ ...existing, escalatedDistricts, totalEscalated });
    toast('✅ Issue Tracker · ' + data.length + ' rows · ' + escalatedDistricts.length + ' districts · total=' + totalEscalated);
    return;
  }

  week.forEach(r => {
    const c = (r[catCol] || 'Other').trim();
    const s = r[slaCol] || '';
    if (!catMap[c]) catMap[c] = { name: c, pendingTotal: 0, pendingWithin: 0, pendingBreach: 0 };
    if (isPending(r)) {
      catMap[c].pendingTotal++;
      if (/breach|missed|overdue|exceed/i.test(s)) catMap[c].pendingBreach++;
      else catMap[c].pendingWithin++;
    }
    if (isEscalated(r)) {
      const bu = (r[buCol] || 'Unknown').trim();
      if (!distMap[bu]) distMap[bu] = { name: bu, count: 0 };
      distMap[bu].count++;
    }
  });
  const categories = Object.values(catMap).filter(c => c.pendingTotal > 0).sort((a, b) => b.pendingTotal - a.pendingTotal);
  const escalatedDistricts = Object.values(distMap).sort((a, b) => a.name.localeCompare(b.name));
  const totalEscalated = escalatedDistricts.reduce((a, d) => a + d.count, 0);

  saveData({ period, reportDate, total, resolved, pending, categories, escalatedDistricts, totalEscalated });
  toast('✅ Imported ' + total + ' tickets · ' + pending + ' pending');
}

function processMobileCSV(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('⚠️ CSV appears empty'); return; }
  const headers = rows[0].map(h => h.trim());
  const data = rows.slice(1).map(r => {
    const obj = {}; headers.forEach((h, i) => { obj[h] = (r[i] || '').trim(); }); return obj;
  });
  const find = patterns => headers.find(h => patterns.some(p => p.test(h))) || '';
  const agentCandidates = headers.filter(h => [/^agent$/i, /^agents$/i, /agent.*name/i, /assigned.*to/i, /assigned.*agent/i, /resolved.*by/i, /handled.*by/i, /^assignee$/i, /^rep$/i, /representative/i, /^owner$/i, /staff/i].some(p => p.test(h)));
  let agentCol = '';
  let bestFill = 0;
  agentCandidates.forEach(h => {
    const fill = data.filter(r => (r[h] || '').trim()).length;
    if (fill > bestFill) { bestFill = fill; agentCol = h; }
  });
  const mobileStatusCol = headers.find(h => /mobile.*app.*status/i.test(h));
  const statCol = mobileStatusCol || find([/^status$/i, /ticket.*status/i, /complaint.*status/i, /case.*status/i, /resolution.*status/i, /request.*status/i, /current.*status/i, /app.*status/i, /status$/i]);
  const catCol = find([/^category$/i, /complaint.*type/i, /complaint.*category/i, /issue.*type/i, /request.*type/i, /^type$/i]);
  const rpCol = find([/responsible.*party/i]);

  const isClosed = r => /closed|resolved|done|replied|responded/i.test(r[statCol] || '') && !/unresolved/i.test(r[statCol] || '');
  const isProgress = r => /in.?progress/i.test(r[statCol] || '');
  const isUnresolved = r => /unresolved/i.test(r[statCol] || '');
  const isBlank = r => !(r[statCol] || '').trim();

  const total = data.length;
  const resolved = data.filter(isClosed).length;
  const inProgress = data.filter(isProgress).length;
  const unresolved = data.filter(isUnresolved).length;
  const blank = data.filter(isBlank).length;

  const prettyName = s => {
    if (!s) return s;
    const local = s.includes('@') ? s.split('@')[0] : s;
    return local.split(/[.\s_]+/).filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
  };
  const agentMap = {};
  data.forEach(r => {
    const raw = (r[agentCol] || '').trim();
    if (!raw) return;
    const a = prettyName(raw);
    if (!agentMap[a]) agentMap[a] = { name: a, total: 0, resolved: 0 };
    agentMap[a].total++;
    if (isClosed(r)) agentMap[a].resolved++;
  });
  const agents = Object.values(agentMap).sort((a, b) => (b.resolved / b.total) - (a.resolved / a.total));

  const catMap = {};
  data.forEach(r => {
    const c = (r[catCol] || 'Other').trim();
    if (!catMap[c]) catMap[c] = { name: c, count: 0 };
    catMap[c].count++;
  });
  const pieColors = ['#1D4ED8', '#3B82F6', '#60A5FA', '#8B5CF6', '#A78BFA', '#16A34A', '#4ADE80', '#D97706', '#FCD34D', '#DC2626', '#F87171', '#6B7CAF'];
  const categories = Object.values(catMap).sort((a, b) => b.count - a.count).map((c, i) => ({ ...c, color: pieColors[i % pieColors.length] }));
  const pieChartUrl = drawPieChart(categories);

  const rpMap = {};
  if (rpCol) {
    data.forEach(r => {
      const p = (r[rpCol] || '').trim();
      if (!p) return;
      if (!rpMap[p]) rpMap[p] = { name: p, total: 0, resolved: 0 };
      rpMap[p].total++;
      if (isClosed(r)) rpMap[p].resolved++;
    });
  }
  const responsibleParties = Object.values(rpMap).map(p => {
    const rate = p.total ? p.resolved / p.total : 0;
    const ratingLabel = rate >= 0.8 ? 'MEETS TARGET' : rate >= 0.5 ? 'AT RISK' : 'BELOW TARGET';
    const ratingBg = rate >= 0.8 ? '#DCFCE7' : rate >= 0.5 ? '#FEF3C7' : '#FEE2E2';
    const ratingColor = rate >= 0.8 ? '#16A34A' : rate >= 0.5 ? '#D97706' : '#DC2626';
    return { name: p.name, total: p.total, resolved: p.resolved, ratingLabel, ratingBg, ratingColor };
  }).sort((a, b) => b.total - a.total);

  saveMobileData({ total, resolved, inProgress, unresolved, blank, agents, categories, responsibleParties, pieChartUrl });
  if (!statCol || !agentCol) {
    toast('⚠️ Imported ' + total + ' but statCol="' + statCol + '" agentCol="' + agentCol + '" not matched. Headers: ' + headers.join(', '), 9000);
  } else {
    toast('✅ Imported ' + total + ' mobile app tickets · ' + resolved + ' resolved');
  }
}

// ============================================================
// SYNC FROM POWER AUTOMATE URL
// ============================================================
async function syncFromUrl(url) {
  setState({ syncing: true });
  try {
    const resp = await fetch(url);
    const json = await resp.json();
    const hd = json.helpdesk || {};
    const cats = (typeof hd.categories === 'string' ? JSON.parse(hd.categories) : hd.categories) || [];
    const pStart = json.period_start || '';
    const pEnd = json.period_end || '';
    const period = pStart && pEnd ? pStart + ' \u2013 ' + pEnd : (json.reportPeriod || '\u2014');
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const today = new Date();
    const liveData = {
      period,
      reportDate: json.reportDate || (today.getDate() + ' ' + mo[today.getMonth()] + ' ' + today.getFullYear()),
      total: +(json.total_assigned || hd.totalTickets || 0),
      resolved: +(json.total_responded || hd.responded || 0),
      pending: +(json.total_pending || 0) || (+(json.total_assigned || 0) - +(json.total_responded || 0)),
      categories: cats.map(c => ({
        name: c.name || c.category || '\u2014',
        pendingTotal: c.pendingTotal || 0,
        pendingWithin: c.pendingWithin || 0,
        pendingBreach: c.pendingBreach || c.breach || 0
      })).filter(c => c.pendingTotal > 0)
    };
    saveData(liveData);
    setState({ syncing: false });
    toast('✅ Synced \u2014 ' + liveData.total + ' tickets');
  } catch (e) {
    setState({ syncing: false });
    toast('\u26a0\ufe0f Sync failed: ' + e.message);
  }
}

// ============================================================
// OBSERVATIONS
// ============================================================
function buildObservations(liveData) {
  if (!liveData || !liveData.total) return [];
  const { pending, categories } = liveData;
  if (!pending) return [{ text: 'All complaints received this week have been resolved. No pending cases to report.' }];
  const obs = [];
  const totalExc = (categories || []).reduce((a, c) => a + (c.pendingBreach || 0), 0);
  const top = (categories || [])[0];
  if (top) obs.push({ text: top.name + '-related complaints are the leading driver of pending cases, accounting for ' + top.pendingTotal + ' of the ' + pending + ' pending cases (' + (pending ? Math.round(top.pendingTotal / pending * 100) : 0) + '%), representing the single largest unresolved category.' });
  if (totalExc > 0) obs.push({ text: totalExc + ' complaint' + (totalExc > 1 ? 's' : '') + ' (' + (pending ? Math.round(totalExc / pending * 100) : 0) + '% of pending cases) have exceeded the SLA timeline. These are categorised as critical and require immediate escalation and prioritised resolution.' });
  (categories || []).filter(c => c.pendingBreach > 0 && c !== top).slice(0, 3).forEach(c => {
    obs.push({ text: c.name + ' complaints account for ' + c.pendingTotal + ' pending cases, with ' + c.pendingBreach + ' exceeding the SLA timeline. ' + ((c.pendingBreach / (c.pendingTotal || 1)) >= 0.5 ? 'This pattern suggests systemic gaps requiring a targeted review.' : 'These cases require close monitoring to prevent further breaches.') });
  });
  obs.push({ text: 'Coordinated intervention is required with relevant teams to establish the current status of each pending request, identify fulfilment bottlenecks, and communicate proactively with affected customers where immediate resolution is not feasible.' });
  return obs;
}

function _b64ToU8(b64) {
  var bin = atob(b64);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function xesc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/\u2019/g, '\u2019');
}

  o = o || {};

    '<w:sz w:val="' + (o.sz || 20) + '"/><w:szCs w:val="' + (o.sz || 20) + '"/></w:rPr>';
}

function RUN(text, o) {
  return '<w:r>' + RPR(o) + '<w:t xml:space="preserve">' + xesc(text) + '</w:t></w:r>';
}

  var out = '', parts = String(str).split('**');
  for (var i = 0; i < parts.length; i++) {
    if (!parts[i]) continue;
    var op = {}; for (var k in o) op[k] = o[k];
    if (i % 2 === 1) op.b = true;
    out += RUN(parts[i], op);
  }
  return out;
}

function P(inner, o) {
  o = o || {};
  var pPr = '<w:pPr>' +
    (o.style ? '<w:pStyle w:val="' + o.style + '"/>' : '') +
    (o.numId ? '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="' + o.numId + '"/></w:numPr>' : '') +
    '<w:spacing w:before="' + (o.before == null ? 40 : o.before) + '" w:after="' + (o.after == null ? 40 : o.after) + '" w:line="240" w:lineRule="auto"/>' +
    (o.jc ? '<w:jc w:val="' + o.jc + '"/>' : '') +
    RPR(o) +
    '</w:pPr>';
  return '<w:p>' + pPr + inner + '</w:p>';
}

function PARA(text, o) { return P(rich(text, o), o); }
function BULLET(text) { return P(rich(text), { numId: 1 }); }

function H2(text) {

var PAGE_W = 10800; // 12240 - (720 * 2)

function CELL(text, w, o) {
  o = o || {};
  var shd = o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '';
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' + shd +
    '<w:vAlign w:val="center"/></w:tcPr>' +
    P(rich(text, { b: o.b, color: o.color, sz: o.sz }), { jc: o.jc || 'center', before: 30, after: 30, b: o.b, color: o.color, sz: o.sz }) +
    '</w:tc>';
}

function TABLE(headers, rows, widths, opts) {
  opts = opts || {};
  var total = widths.reduce(function (a, b) { return a + b; }, 0);
  var borders = '<w:tblBorders>' +
    ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function (s) {
      return '<w:' + s + ' w:val="single" w:sz="4" w:space="0" w:color="BFBFBF"/>';
    }).join('') + '</w:tblBorders>';
  var xml = '<w:tbl><w:tblPr><w:tblW w:w="' + total + '" w:type="dxa"/>' +
    '<w:jc w:val="center"/>' + borders +
    '<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>' +
    widths.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join('') + '</w:tblGrid>';
  if (headers && headers.length) {
    xml += '<w:tr><w:trPr><w:tblHeader/></w:trPr>' +
      headers.map(function (h, i) {
        return CELL(h, widths[i], { b: true, fill: '1E3070', color: 'FFFFFF', sz: 18 });
      }).join('') + '</w:tr>';
  }
  rows.forEach(function (r, ri) {
    var isTot = opts.totalRow && ri === rows.length - 1;
    xml += '<w:tr>' + r.map(function (c, i) {
      var cellOpts = { sz: opts.sz || 19, jc: i === 0 ? 'left' : 'center' };
      if (isTot) { cellOpts.b = true; cellOpts.fill = 'EFEFEF'; }
      if (opts.bigNums) { cellOpts.sz = 26; cellOpts.b = true; }
      return CELL(c, widths[i], cellOpts);
    }).join('') + '</w:tr>';
  });
  return xml + '</w:tbl>' + P('', { before: 0, after: 60 });
}

function CHART(rId, cx, cy, name, id) {

    '<w:r><w:rPr>' + CG + '<w:noProof/><w:sz w:val="20"/></w:rPr><w:drawing>' +
    '<wp:inline distT="0" distB="0" distL="0" distR="0">' +
    '<wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
    '<wp:effectExtent l="0" t="0" r="0" b="0"/>' +
    '<wp:docPr id="' + id + '" name="' + xesc(name) + '"/><wp:cNvGraphicFramePr/>' +
    '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
    '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart">' +
    '<c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="' + rId + '"/>' +
    '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}

// Horizontal bar rendered inside a table cell using nested-table shading (Word-safe)
function BARCELL(fraction, w) {
  var filled = Math.max(3, Math.round(fraction * 100));
  var innerW = Math.round(w * filled / 100);
  var restW = w - innerW;
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>' +
    '<w:tbl><w:tblPr><w:tblW w:w="' + w + '" w:type="dxa"/>' +
    '<w:tblBorders>' + ['top','left','bottom','right','insideH','insideV'].map(function(sd){return '<w:'+sd+' w:val="none" w:sz="0" w:space="0" w:color="auto"/>';}).join('') + '</w:tblBorders>' +
    '<w:tblLayout w:type="fixed"/></w:tblPr>' +
    '<w:tblGrid><w:gridCol w:w="' + innerW + '"/><w:gridCol w:w="' + Math.max(1, restW) + '"/></w:tblGrid>' +
    '<w:tr><w:trPr><w:trHeight w:val="150" w:hRule="exact"/></w:trPr>' +
    '<w:tc><w:tcPr><w:tcW w:w="' + innerW + '" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="1D4ED8"/></w:tcPr>' +
    '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr></w:p></w:tc>' +
    '<w:tc><w:tcPr><w:tcW w:w="' + Math.max(1, restW) + '" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="EEF2FF"/></w:tcPr>' +
    '<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr></w:p></w:tc>' +
    '</w:tr></w:tbl>' +
    '<w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr></w:p></w:tc>';
}

// A table where one column is a horizontal bar (name | bar | value)
function BARTABLE(rows, wName, wBar, wVal) {
  var total = wName + wBar + wVal;
  var mx = rows.reduce(function(m,r){return Math.max(m, r.value);}, 1);
  var borders = '<w:tblBorders>' + ['top','left','bottom','right','insideH','insideV'].map(function(sd){return '<w:'+sd+' w:val="none" w:sz="0" w:space="0" w:color="auto"/>';}).join('') + '</w:tblBorders>';
  var xml = '<w:tbl><w:tblPr><w:tblW w:w="' + total + '" w:type="dxa"/><w:jc w:val="center"/>' + borders + '<w:tblLayout w:type="fixed"/></w:tblPr>' +
    '<w:tblGrid><w:gridCol w:w="' + wName + '"/><w:gridCol w:w="' + wBar + '"/><w:gridCol w:w="' + wVal + '"/></w:tblGrid>';
  rows.forEach(function(r){
    xml += '<w:tr>' +
      CELL(r.label, wName, { sz: 18, jc: 'left' }) +
      BARCELL(r.value / mx, wBar) +
      CELL(r.display, wVal, { sz: 18, b: true, color: '1D4ED8', jc: 'right' }) +
    '</w:tr>';
  });
  return xml + '</w:tbl>' + P('', { before: 0, after: 60 });
}

// Swap the cached category labels and values inside a chart part
function patchChart(xml, cats, vals) {
  var n = cats.length;
  var catPts = cats.map(function (c, i) {
    return '<c:pt idx="' + i + '"><c:v>' + xesc(c) + '</c:v></c:pt>';
  }).join('');
  var valPts = vals.map(function (v, i) {
    return '<c:pt idx="' + i + '"><c:v>' + v + '</c:v></c:pt>';
  }).join('');

  xml = xml.replace(/<c:cat>[\s\S]*?<\/c:cat>/,
    '<c:cat><c:strRef><c:f>Sheet1!$A$2:$A$' + (n + 1) + '</c:f><c:strCache>' +
    '<c:ptCount val="' + n + '"/>' + catPts + '</c:strCache></c:strRef></c:cat>');

  xml = xml.replace(/<c:val>[\s\S]*?<\/c:val>/,
    '<c:val><c:numRef><c:f>Sheet1!$B$2:$B$' + (n + 1) + '</c:f><c:numCache>' +
    '<c:formatCode>General</c:formatCode><c:ptCount val="' + n + '"/>' + valPts +
    '</c:numCache></c:numRef></c:val>');

  // Drop per-point overrides — they are tied to the old point indices
  xml = xml.replace(/<c:dPt>[\s\S]*?<\/c:dPt>/g, '');
  xml = xml.replace(/<c:dLbl>[\s\S]*?<\/c:dLbl>/g, '');
  return xml;
}

// Patch categories + values but KEEP the per-point colour overrides (for the hourly chart)
function patchChartVals(xml, cats, vals) {
  var n = cats.length;
  var catPts = cats.map(function (c, i) {
    return '<c:pt idx="' + i + '"><c:v>' + xesc(c) + '</c:v></c:pt>';
  }).join('');
  var valPts = vals.map(function (v, i) {
    return '<c:pt idx="' + i + '"><c:v>' + v + '</c:v></c:pt>';
  }).join('');
  xml = xml.replace(/<c:cat>[\s\S]*?<\/c:cat>/,
    '<c:cat><c:strRef><c:f>Sheet1!$A$2:$A$' + (n + 1) + '</c:f><c:strCache>' +
    '<c:ptCount val="' + n + '"/>' + catPts + '</c:strCache></c:strRef></c:cat>');
  xml = xml.replace(/<c:val>[\s\S]*?<\/c:val>/,
    '<c:val><c:numRef><c:f>Sheet1!$B$2:$B$' + (n + 1) + '</c:f><c:numCache>' +
    '<c:formatCode>General</c:formatCode><c:ptCount val="' + n + '"/>' + valPts +
    '</c:numCache></c:numRef></c:val>');
  return xml;
}

function buildBodyXml(o) {
  var x = '';
  var h = o.helpdesk || {}, m = o.mobile || {}, lc = o.liveChat || {};
  var total = h.total || 0, resolved = h.resolved || 0, pending = h.pending || 0;
  var resRate = total ? Math.round(resolved / total * 100) : 0;
  var mTotal = m.total || 0, mResolved = m.resolved || 0;
  var mRate = mTotal ? Math.round(mResolved / mTotal * 100) : 0;
  var lcTotal = lc.total || 0, lcResolved = lc.resolved || 0;
  var lcRate = lcTotal ? Math.round(lcResolved / lcTotal * 100) : 0;
  var unitTotal = total + mTotal + lcTotal;
  var unitResolved = resolved + mResolved + lcResolved;
  var unitRate = unitTotal ? Math.round(unitResolved / unitTotal * 100) : 0;
  var period = o.period || '';

  // ---- Introduction ----
  x += H2('Introduction');
  x += PARA('This report presents a week-to-date review of CX unit performance for the period **' + period +
    '** across all active complaint channels **Email Helpdesk, Mobile App (EKEDP Power App), and Live Chat**. ' +
    'It covers ticket volume and resolution status. The objective of this report is to support executive oversight ' +
    'and informed decision-making, strengthen service delivery standards across all channels, drive timely resolution ' +
    'of complaints, and ensure all complaints are properly documented and monitored.');
  var introHourly = lc.hourly;
  if (introHourly && introHourly.total) {
    x += PARA('On the Live Chat channel, a total of **' + introHourly.total + '** conversations were recorded across the period, ' +
      'with **' + introHourly.outsidePct + '%** arriving outside the standard 08:00\u201317:00 working window and the busiest ' +
      'single hour falling at **' + hourLabel(introHourly.peakHour) + '**. A full hour-by-hour breakdown is provided in section 3.0.');
  }

  // ---- Executive Summary ----
  x += H2('Executive Summary');
  x += PARA('Across the unit, **' + unitTotal + '** tickets were received this period, of which **' + unitResolved +
    '** (**' + unitRate + '%**) were treated and resolved. Email Helpdesk received **' + total +
    '** complaints and resolved **' + resRate + '%**, with **' + pending +
    '** awaiting a response from the customer to proceed. Mobile App received **' + mTotal +
    '** tickets at a **' + mRate + '%** resolution rate.' +
    (lcTotal ? ' Live Chat handled **' + lcTotal + '** chats at a **' + lcRate + '%** resolution rate.' : ''));

  var chRows = [
    ['Email Helpdesk', String(total), String(resolved), resRate + '%'],
    ['Mobile App', String(mTotal), String(mResolved), mRate + '%']
  ];
  if (lcTotal) chRows.push(['Live Chat', String(lcTotal), String(lcResolved), lcRate + '%']);
  chRows.push(['Unit Total', String(unitTotal), String(unitResolved), unitRate + '%']);
  x += TABLE(['CHANNEL', 'TOTAL', 'RESOLVED', 'RATE'], chRows, [4200, 2200, 2200, 2200], { totalRow: true });

  // ---- Channel Performance ----
  x += H2('Channel Performance');
  x += H3('1.0  Email Helpdesk');
  x += PARA('**EMAIL HELPDESK COMPLAINTS FOR THE WEEK ' + period.toUpperCase() + '**');
  x += TABLE(['TOTAL RECEIVED', 'TOTAL RESOLVED', 'TOTAL PENDING', '% RESOLVED'],
    [[String(total), String(resolved), String(pending), resRate + '%']],
    [2700, 2700, 2700, 2700], { bigNums: true });

  var cats = h.categories || [];
  var tw = cats.reduce(function (a, c) { return a + (c.pendingWithin || 0); }, 0);
  var te = cats.reduce(function (a, c) { return a + (c.pendingBreach || 0); }, 0);
  var topCat = cats.slice().sort(function (a, b) { return (b.pendingTotal || 0) - (a.pendingTotal || 0); })[0];
  var topPct = (topCat && pending) ? Math.round((topCat.pendingTotal || 0) / pending * 100) : 0;
  var excPct = pending ? Math.round(te / pending * 100) : 0;
  var topBrPct = (topCat && te) ? Math.round((topCat.pendingBreach || 0) / te * 100) : 0;

  if (topCat) {
    x += PARA('**' + topCat.name + '** is the dominant driver of this week\u2019s pending backlog, accounting for **' +
      topPct + '%** of all pending cases.');
  }
  if (te > 0) {
    x += PARA('Most pending ' + (topCat ? topCat.name : '') + ' cases are currently **Awaiting Customer Response**, ' +
      'held pending supporting documentation from the customer before work can proceed. **' + te +
      '** complaints have exceeded the SLA timeline representing **' + excPct + '%** of all pending cases. **' +
      (topCat ? topCat.pendingBreach || 0 : 0) + ' (' + topBrPct + '%)** are ' + (topCat ? topCat.name : '') +
      ' cases alone, making this the single largest contributor to SLA risk this week and the clearest priority ' +
      'for immediate follow-up. The remaining **' + tw + ' cases** across other categories are within timeline ' +
      'but should continue to be monitored closely to prevent further breaches.');
  }

  x += PARA('**AGE ANALYSIS OF PENDING EMAIL HELPDESK COMPLAINTS**');
  var ageRows = cats.map(function (c) {
    return [c.name.toUpperCase(), String(c.pendingWithin || 0), String(c.pendingBreach || 0), String(c.pendingTotal || 0)];
  });
  ageRows.push(['Grand Total', String(tw), String(te), String(pending)]);
  x += TABLE(['REQUEST STATUS', 'WITHIN TIMELINE', 'EXCEEDED TIMELINE', 'TOTAL PENDING'],
    ageRows, [3400, 2500, 2500, 2400], { totalRow: true });

  // ---- 1.1 flow ----
  x += H3('1.1  How a Complaint moved through the system this week.');

    'replies return to whoever already owns that ticket, and anything needing on-site action was escalated directly ' +

  });

  x += H3('1.2  Escalated to District');

  if (dists.length) {
    x += PARA('**Complaints Escalated to District Teams \u2014 By District**');
    x += CHART('rId6', 7096760, 2700997, 'District Escalation Chart', 500000001);
  }

  // ---- 2.0 mobile ----
  x += H3('2.0  Mobile App Channel (EKEDP Power App)');
  if (mTotal) {
    x += PARA('**MOBILE APP TICKETS FOR THE WEEK ' + period.toUpperCase() + '**');
    x += TABLE(['TOTAL', 'RESOLVED', 'IN PROGRESS', 'UNRESOLVED', 'RATE'],
      [[String(mTotal), String(mResolved), String(m.inProgress || 0), String(m.unresolved || 0), mRate + '%']],
      [2160, 2160, 2160, 2160, 2160], { bigNums: true });
    var mCats = (m.categories || []).slice().sort(function (a, b) { return b.count - a.count; });
    if (mCats.length) {
      x += PARA('**BY CATEGORY**');
      x += CHART('rId7', 6758940, 3868615, 'Mobile App Tickets by Category', 500000002);
    }
    var rps = m.responsibleParties || [];
    if (rps.length) {
      x += PARA('**BY RESPONSIBLE PARTY**');
      x += TABLE(['PARTY', 'TOTAL', 'RESOLVED', 'RATING'],
        rps.map(function (p) { return [p.name, String(p.total), String(p.resolved), p.ratingLabel || '']; }),
        [4200, 1800, 1800, 3000]);
    }
  } else {
    x += PARA('No mobile app data reported for this period.');
  }

  // ---- 3.0 live chat ----
  x += H3('3.0  Live Chat Channel');
  if (lcTotal) {
    x += PARA('**LIVE CHAT FOR THE PERIOD ' + String(lc.period || period).toUpperCase() + '**');
    x += TABLE(['TOTAL CHATS', 'RESOLVED', 'FWD TO EKEDC', 'PENDING', 'RATE'],
      [[String(lcTotal), String(lcResolved), String(lc.fwd || 0), String(lc.pending || 0), lcRate + '%']],
      [2160, 2160, 2160, 2160, 2160], { bigNums: true });
    var lcCats = lc.categories || [];
    if (lcCats.length) {
      x += PARA('**BY CATEGORY**');
      x += TABLE(['CATEGORY', 'COUNT'],
        lcCats.map(function (c) { return [c.name, String(c.count)]; }), [7400, 3400]);
    }
  } else {
    x += PARA('Resolution figures for this period have not yet been entered.');
  }

  var a = lc.hourly;
  if (a && a.total) {
    x += PARA('**CONVERSATION VOLUME BY HOUR OF DAY**');
    x += CHART('rId20', 6858000, 2600000, 'Live Chat Conversation Volume by Hour', 500000003);
    x += PARA('A total of **' + a.total + '** conversations were recorded across the period (**' +

      'distributed across the day: **' + a.outside + '** conversations (**' + a.outsidePct +
      '%**) arrived outside the standard 08:00\u201317:00 working window, while overnight traffic between midnight ' +
      'and 06:00 accounted for only **' + a.night + '** conversations (**' + a.nightPct + '%**) of total volume. ' +
      'The busiest single hour of the day was **' + hourLabel(a.peakHour) + '**, carrying **' + a.peakCount +
      '** conversations.');
    x += TABLE(['TIME BAND', 'CONVERSATIONS', 'SHARE'], [
      ['Midnight \u2013 6:00 AM', String(a.night), a.nightPct + '%'],
      ['6:00 AM \u2013 8:00 AM', String(a.early), a.earlyPct + '%'],
      ['8:00 AM \u2013 5:00 PM (core day)', String(a.core), a.corePct + '%'],
      ['5:00 PM \u2013 10:00 PM (evening)', String(a.evening), a.eveningPct + '%'],
      ['10:00 PM \u2013 Midnight', String(a.late), a.latePct + '%'],
      ['Total', String(a.total), '100%']
    ], [5000, 3000, 2800], { totalRow: true });
    if (a.outsidePct >= 35) {
      x += PARA('This distribution indicates that chat coverage cannot be sustained on a standard **08:00\u201317:00** ' +

  // ---- 4.0 ambassador programme ----

      ', with cumulative referral transaction value of **\u20a6' + Math.round(amb.txnNow).toLocaleString() + '**' +
      (amb.txnPrev ? ' (up from \u20a6' + Math.round(amb.txnPrev).toLocaleString() + ', a ' + txnGrowth + '% increase)' : '') +

    }), 4200, 4400, 2200);

    x += PARA('**FULL AMBASSADOR LIST**');
    var rowsFull = amb.list.slice().sort(function(a,b){return b.txnNow - a.txnNow;}).map(function(a, i){
      return [String(i + 1), a.name, a.code || '\u2014', String(a.signNow), '\u20a6' + Math.round(a.txnNow).toLocaleString()];
    });
    rowsFull.push(['', 'TOTAL', '', String(amb.signNow), '\u20a6' + Math.round(amb.txnNow).toLocaleString()]);
    x += TABLE(['S/N', 'AMBASSADOR', 'REFERRAL CODE', 'SIGN-UPS', 'TRANSACTION VALUE'],
      rowsFull, [900, 3800, 2300, 1600, 2200], { totalRow: true, sz: 17 });
  }

  // ---- tail ----
  if (o.observations && o.observations.length) {
    x += H2('Key Observations');
    o.observations.forEach(function (t) { x += BULLET(t); });
  }
  var hasAmb = !!(o.ambassador && o.ambassador.count);
  var nRisk = hasAmb ? '5.0' : '4.0';
  var nRec = hasAmb ? '6.0' : '5.0';
  var nConc = hasAmb ? '7.0' : '6.0';
  x += H2(nRisk + '  Key Risks');
  (o.risks || []).forEach(function (t) { x += BULLET(t); });
  x += H2(nRec + '  Recommendations');
  (o.recs || []).forEach(function (t) { x += BULLET(t); });
  x += H2(nConc + '  Conclusion');
  x += PARA(o.conclusion || '');
  x += PARA('');
  x += PARA('Prepared by: **' + (o.prepBy || '') + '**');
  x += PARA(o.prepTitle || '');
  return x;
}

function nativeWordExport(o) {
  if (!window.JSZip) { toast('\u26a0\ufe0f Export library still loading \u2014 try again in a moment'); return; }
  var zip = new window.JSZip();
  zip.loadAsync(_b64ToU8(DOCX_TPL_B64)).then(function (z) {
    return z.file('word/document.xml').async('string').then(function (doc) {
      // Reuse the approved header block verbatim, swapping only the memo fields
      var bodyStart = doc.indexOf('<w:body>') + 8;
      var introAt = doc.indexOf('>Introduction<');
      var hdrEnd = doc.lastIndexOf('<w:p ', introAt);
      var header = doc.substring(bodyStart, hdrEnd);
      var sectAt = doc.lastIndexOf('<w:sectPr');
      var sect = doc.substring(sectAt);

      header = header
        .replace('001/EHD/005/2026', xesc(o.ref || '\u2014'))
        .replace('17th July 2026', xesc(o.date || ''))
        .replace('Manager Email/ Mobile APP/Live Chat helpdesk CX', xesc(o.from || ''));

      var head = doc.substring(0, bodyStart);
      z.file('word/document.xml', head + header + buildBodyXml(o) + sect);

      // Chart 1 — district escalations (3D bar)
      var dists = ((o.helpdesk && o.helpdesk.escalatedDistricts) || [])
        .slice().sort(function (a, b) { return b.count - a.count; });
      var p1 = dists.length
        ? z.file('word/charts/chart1.xml').async('string').then(function (c) {
            z.file('word/charts/chart1.xml', patchChart(c,
              dists.map(function (d) { return String(d.name).toUpperCase(); }),
              dists.map(function (d) { return d.count; })));
          })
        : Promise.resolve();

      // Chart 2 — mobile app categories
      var mCats = ((o.mobile && o.mobile.categories) || [])
        .slice().sort(function (a, b) { return b.count - a.count; });
      var p2 = mCats.length
        ? z.file('word/charts/chart2.xml').async('string').then(function (c) {
            z.file('word/charts/chart2.xml', patchChart(c,
              mCats.map(function (d) { return String(d.name).toUpperCase(); }),
              mCats.map(function (d) { return d.count; })));
          })
        : Promise.resolve();

      var lch = o.liveChat && o.liveChat.hourly;
      var p3 = (lch && lch.total)
        ? z.file('word/charts/chart3.xml').async('string').then(function (c) {
            var labels = [];
            for (var i = 0; i < 24; i++) {
              var ap = i < 12 ? 'AM' : 'PM';
              var hh = i % 12 === 0 ? 12 : i % 12;
              labels.push(hh + ap);
            }
            z.file('word/charts/chart3.xml', patchChartVals(c, labels, lch.hours));
          })
        : Promise.resolve();

      return Promise.all([p1, p2, p3]).then(function () {
        return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      });
    });
  }).then(function (blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'EKEDP_CX_Weekly_Report_' + String(o.period || '').replace(/[\s\/\\:,&\u2013\u2014]/g, '_') + '.docx';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); document.body.removeChild(a); }, 2000);
    toast('\u2705 Word report exported with editable charts');
  }).catch(function (err) {
    console.error(err);
    toast('\u26a0\ufe0f Export failed: ' + (err && err.message ? err.message : 'unknown error'));
  });
}

function doExportWord(vals) {
  if (!window.JSZip) { alert('Export library not yet loaded \u2014 please try again in a moment.'); return; }
  const liveData = state.liveData;
  const currentPeriod = (liveData && liveData.period) || '';
  const currentDate = (liveData && liveData.reportDate) || new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const p = window.prompt('Report period:', currentPeriod); if (p === null) return;
  const d = window.prompt('Report date:', currentDate); if (d === null) return;
  const r = window.prompt('Ref number:', state.settings.ref || '001/EHD/001/2026'); if (r === null) return;
  const f = window.prompt('From:', state.settings.from || 'Manager, Email Helpdesk CX'); if (f === null) return;
  const b = window.prompt('Prepared by (name):', state.settings.prepBy || ''); if (b === null) return;
  const t = window.prompt('Prepared by (title):', state.settings.prepTitle || 'Email Helpdesk CX'); if (t === null) return;
  const cats = vals._cats || [];
  const pendingTotal = cats.reduce((a, c) => a + (c.pendingTotal || 0), 0);
  const topCat = cats.slice().sort((x, y) => (y.pendingTotal || 0) - (x.pendingTotal || 0))[0];
  const resRate = vals.total ? Math.round(vals.resolved / vals.total * 100) : 0;
  const obs = buildObservations({ pending: pendingTotal, categories: cats }).map(o => o.text);
  const risks = [
    'The sustained backlog in' + (topCat ? ' ' + topCat.name + '-related and other' : '') + ' overdue complaints directly exposes the company to service delivery lapses and customer dissatisfaction.',
    'Non-adherence to prescribed complaint resolution timelines constitutes a compliance risk and may attract increased scrutiny and reputational consequences.',
    'Unresolved complaints particularly those exceeding the SLA timeline increase the risk of repeat escalations, negative customer feedback, and attrition.',
    'A growing backlog of overdue complaints may undermine customer confidence and erode trust in the Email Helpdesk as a reliable resolution channel.'
  ];
  const recs = [
    'Immediate prioritisation of pending' + (topCat ? ' ' + topCat.name : '') + ' requests in collaboration with the relevant team to accelerate resolution.',
    'Daily monitoring and escalation of all pending cases to ensure timely closure and avoid further SLA breaches.',
    'Proactive customer communication for cases where resolution cannot be achieved within the current reporting week.',
    'Weekly review of SLA performance by category to identify and address recurring operational bottlenecks.'
  ];
  const conclusion = 'While overall resolution performance for the week stands at **' + resRate + '%**, continued focus is required to clear the pending backlog' + (topCat ? ', particularly ' + topCat.name + '-driven cases,' : '') + ' to sustain service delivery standards, improve customer satisfaction, and avoid repeat escalations. Continued monitoring of SLA compliance across all complaint categories is recommended.';

  nativeWordExport({
    period: p || currentPeriod, date: d || currentDate, ref: r, from: f, prepBy: b || f, prepTitle: t,
    helpdesk: {
      total: vals.total, resolved: vals.resolved, pending: pendingTotal,
      categories: cats, escalatedDistricts: vals._escalatedDistricts, totalEscalated: vals.totalEscalated
    },
    mobile: state.mobileData ? Object.assign({}, state.mobileData, { responsibleParties: vals.mobileRPRows }) : null,
    liveChat: vals._liveChatData,
    ambassador: state.ambassadorData || null,
    observations: obs, risks: risks, recs: recs, conclusion: conclusion
  });
}

function computeVals() {
  const { liveData, mobileData, liveChatData, activeTab, settings, showSettings, syncing, showToast, toastMsg } = state;

  const lcTotal = (liveChatData && liveChatData.total) || 0;
  const lcResolved = (liveChatData && liveChatData.resolved) || 0;
  const lcFwd = (liveChatData && liveChatData.fwd) || 0;
  const lcPending = (liveChatData && liveChatData.pending) || 0;
  const lcRate = lcTotal ? Math.round(lcResolved / lcTotal * 100) : 0;
  const lcCategories = (liveChatData && liveChatData.categories) || [];
  const lcPeriod = (liveChatData && liveChatData.period) || '';
  const hasLiveChat = !!(liveChatData && liveChatData.total);

  const mobileTotal = (mobileData && mobileData.total) || 0;
  const mobileResolved = (mobileData && mobileData.resolved) || 0;
  const mobileInProgress = (mobileData && mobileData.inProgress) || 0;
  const mobileUnresolved = (mobileData && mobileData.unresolved) || 0;
  const mobileBlank = (mobileData && mobileData.blank) || 0;
  const mobilePending = mobileInProgress + mobileUnresolved;
  const mobileRate = mobileTotal ? Math.round(mobileResolved / mobileTotal * 100) : 0;
  const mobileCatRows = (mobileData && mobileData.categories) || [];
  const mobileRPRows = (mobileData && mobileData.responsibleParties) || [];
  const mobilePieUrl = (mobileData && mobileData.pieChartUrl) || '';

  const total = (liveData && liveData.total) || 0;
  const resolved = (liveData && liveData.resolved) || 0;
  const pending = (liveData && liveData.pending) || (total - resolved);
  const resRate = total ? Math.round(resolved / total * 100) : 0;
  const cats = (liveData && liveData.categories) || [];
  const escalatedDistricts = (liveData && liveData.escalatedDistricts) || [];
  const totalEscalated = (liveData && liveData.totalEscalated) || 0;
  const totalExceeded = cats.reduce((a, c) => a + (c.pendingBreach || 0), 0);
  const totalWithin = cats.reduce((a, c) => a + (c.pendingWithin || 0), 0);
  const pendingRows = cats.map(c => ({ name: c.name, within: c.pendingWithin || 0, breach: c.pendingBreach || 0, pend: c.pendingTotal || 0, breachColor: (c.pendingBreach || 0) > 0 ? '#DC2626' : '#16A34A' }));
  const maxDist = escalatedDistricts.length ? escalatedDistricts[0].count : 1;
  const distRows = escalatedDistricts.map(d => ({ name: d.name, count: d.count, barPct: Math.round(d.count / maxDist * 100) }));
  const observations = buildObservations(liveData);

  const unitTotal = total + mobileTotal;
  const unitResolved = resolved + mobileResolved;
  const unitRate = unitTotal ? Math.round(unitResolved / unitTotal * 100) : 0;

  return {
    tabOverview: activeTab === 'overview', tabEmail: activeTab === 'email', tabMobile: activeTab === 'mobile', tabLiveChat: activeTab === 'livechat', tabAmbassador: activeTab === 'ambassador',
    unitTotal, unitResolved, unitRate,
    mobileTotal, mobileResolved, mobileInProgress, mobileUnresolved, mobilePending, mobileRate,
    mobileBlankNote: mobileBlank > 0 ? (' · ' + mobileBlank + ' tickets have a blank status and are excluded') : '',
    mobileCatRows, noMobileCats: mobileCatRows.length === 0,
    mobileRPRows, noMobileRP: mobileRPRows.length === 0,
    mobilePieUrl,
    total, resolved, pending, resRate,
    totalExceeded, totalWithin, totalEscalated,
    distRows, noDistRows: distRows.length === 0,
    pendingRows, noPendingRows: pendingRows.length === 0,
    exceededLabel: totalExceeded > 0 ? totalExceeded + ' exceeded SLA' : 'All within timeline',
    observations, noObservations: observations.length === 0,
    keyRisks: [
      { text: 'The sustained backlog in' + (cats[0] ? ' ' + cats[0].name + '-related and other' : '') + ' overdue complaints directly exposes the company to service delivery lapses and customer dissatisfaction.' },
      { text: 'Non-adherence to prescribed complaint resolution timelines constitutes a compliance risk and may attract increased scrutiny and reputational consequences.' },
      { text: 'Unresolved complaints — particularly those exceeding the SLA timeline — increase the risk of repeat escalations, negative customer feedback, and attrition.' },
      { text: 'A growing backlog of overdue complaints may undermine customer confidence and erode trust in the Email Helpdesk as a reliable resolution channel.' }
    ],
    reportPeriod: (liveData && liveData.period) || 'No data — open Settings to import',
    reportDate: (liveData && liveData.reportDate) || '\u2014',
    showSettings,
    syncUrl: settings.syncUrl || '', refNum: settings.ref || '', fromVal: settings.from || '', prepBy: settings.prepBy || '', prepTitle: settings.prepTitle || '',
    syncLabel: syncing ? '\u29d7 Syncing...' : '\u27f3 Sync',
    statusMsg: total > 0 ? 'Data loaded \u00b7 ' + total + ' tickets' : 'No data loaded',
    showToast, toastMsg: toastMsg || '',
    lcTotal, lcResolved, lcFwd, lcPending, lcRate, lcCategories, lcPeriod, hasLiveChat,
    lcHourly: (liveChatData && liveChatData.hourly) || null,
    noLcCategories: lcCategories.length === 0,
    _cats: cats, _escalatedDistricts: escalatedDistricts, _liveChatData: liveChatData,
    amb: state.ambassadorData || null, hasAmb: !!(state.ambassadorData && state.ambassadorData.count)
  };
}

          <div style="display:flex; align-items:flex-end; gap:2px; height:70px; margin-bottom:4px;">
            ${v.lcHourly.hours.map((n, i) => {
              const mx = Math.max.apply(null, v.lcHourly.hours) || 1;
              const hgt = Math.max(2, Math.round(n / mx * 66));
              const col = (i < 6) ? '#93B4E8' : (i >= 8 && i < 17) ? '#1D4ED8' : '#C2410C';

          <div style="display:flex; gap:12px; margin-top:10px; font-size:9px; color:#6B7CAF;">
            <span><span style="display:inline-block;width:8px;height:8px;background:#93B4E8;border-radius:2px;"></span> Overnight</span>
            <span><span style="display:inline-block;width:8px;height:8px;background:#1D4ED8;border-radius:2px;"></span> Core day</span>
            <span><span style="display:inline-block;width:8px;height:8px;background:#C2410C;border-radius:2px;"></span> Early / evening</span>
          </div>
        </div>` : ''}
      </div>
    </div>
    ` : ''}

    ${v.tabAmbassador ? `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;">

      <div style="background:#fff; border:1px solid #D1D9F0; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(30,48,112,0.07);">
        <div style="padding:14px 20px; border-bottom:1px solid #E8EDF5;">
          <div style="font-size:13px; font-weight:700; color:#1E3070;">\U0001f91d Ambassador Programme</div>
          <div style="font-size:10px; color:#9AA5C4; margin-top:1px;">Import the Power App referral dashboard spreadsheet</div>
        </div>
        <div style="padding:18px 20px;">
          <div style="font-size:10px; color:#9AA5C4; margin-bottom:12px; line-height:1.6;">Upload the <strong>EKEDP Power App Dashboard</strong> Excel file (.xlsx). It reads the ambassador names, sign-ups and referral transaction values, builds a top-10 chart and the full table, and adds the section to the Word export.</div>
          <label style="display:block; background:#F5F7FF; border:1px dashed #B9C6E8; color:#1D4ED8; text-align:center; padding:14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;">
            \u2b06 Import Dashboard (.xlsx)
            <input type="file" accept=".xlsx,.xls" onchange="app.importAmbassadorXlsx(event)" style="display:none;">
          </label>
          ${v.hasAmb ? `<div style="font-size:10px; color:#16A34A; margin-top:10px; font-weight:700;">\u2713 ${v.amb.count} ambassadors loaded \u00b7 \u20a6${Math.round(v.amb.txnNow).toLocaleString()} total transactions</div>` : ''}
        </div>
      </div>

      <div style="background:#fff; border:1px solid #D1D9F0; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(30,48,112,0.07);">
        <div style="padding:14px 20px; border-bottom:1px solid #E8EDF5;">
          <div style="font-size:13px; font-weight:700; color:#1E3070;">Preview</div>
          <div style="font-size:10px; color:#9AA5C4; margin-top:1px;">This is what will appear in the Word export</div>
        </div>
        ${v.hasAmb ? `
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 20px;">
          <div style="background:#F5F7FF; border-radius:8px; padding:12px; text-align:center;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:#1D4ED8;">${v.amb.count}</div>
            <div style="font-size:9px; color:#9AA5C4; margin-top:2px;">AMBASSADORS</div>
          </div>
          <div style="background:#F5F7FF; border-radius:8px; padding:12px; text-align:center;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:#16A34A;">${v.amb.active}</div>
            <div style="font-size:9px; color:#9AA5C4; margin-top:2px;">ACTIVE</div>
          </div>
          <div style="background:#F5F7FF; border-radius:8px; padding:12px; text-align:center;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:#1D4ED8;">${v.amb.signNow}</div>
            <div style="font-size:9px; color:#9AA5C4; margin-top:2px;">SIGN-UPS ${v.amb.signPrev ? ('\u00b7 was ' + v.amb.signPrev) : ''}</div>
          </div>
          <div style="background:#F5F7FF; border-radius:8px; padding:12px; text-align:center;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:#8B5CF6;">\u20a6${Math.round(v.amb.txnNow).toLocaleString()}</div>
            <div style="font-size:9px; color:#9AA5C4; margin-top:2px;">TRANSACTIONS</div>
          </div>
        </div>
        <div style="padding:0 20px 18px 20px;">
          <div style="font-size:10px; color:#6B7CAF; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;">Top 10 by Transaction Value</div>
          ${v.amb.top10.map(a => {
            const mx = v.amb.top10[0].txnNow || 1;
            const w = Math.max(3, Math.round(a.txnNow / mx * 100));
            return `<div style="margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; font-size:10px; color:#374151; margin-bottom:2px;">
                <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px;">${esc(a.name)}</span>
                <span style="font-family:'JetBrains Mono',monospace; font-weight:700; color:#1D4ED8;">\u20a6${Math.round(a.txnNow).toLocaleString()}</span>
              </div>
              <div style="background:#EEF2FF; border-radius:3px; height:8px;"><div style="background:#1D4ED8; width:${w}%; height:8px; border-radius:3px;"></div></div>
            </div>`;
          }).join('')}
        </div>
        ` : `
        <div style="padding:40px 20px; text-align:center;">
          <div style="font-size:28px; margin-bottom:8px;">\U0001f91d</div>
          <div style="font-size:12px; color:#9AA5C4;">Import the dashboard spreadsheet to see a preview here</div>
        </div>
        `}
      </div>
    </div>
    ` : ''}

    </div>

    ${v.showSettings ? `
    <div onclick="app.closeSettingsBg(event)" style="position:fixed; inset:0; background:rgba(30,48,112,0.35); z-index:1000; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px); padding:20px;">
      <div onclick="event.stopPropagation()" style="background:#fff; border:1px solid #D1D9F0; border-radius:16px; width:520px; max-width:100%; max-height:90vh; overflow-y:auto; padding:28px; box-shadow:0 20px 60px rgba(30,48,112,0.15);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
          <div style="font-size:16px; font-weight:700; color:#1E3070;">⚙ Settings</div>
          <div onclick="app.closeSettings()" style="color:#9AA5C4; font-size:18px; cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px;">✕</div>
        </div>

        <div style="margin-bottom:20px;">
          <div style="font-size:10px; color:#6B7CAF; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:7px;">☁️ Power Automate Sync URL</div>
          <div style="display:flex; gap:8px;">
            <input id="syncUrlInput" type="text" placeholder="https://prod-xx.westus.logic.azure.com/..." value="${esc(v.syncUrl)}" oninput="app.onSyncUrl(event)" style="flex:1; background:#F5F7FF; border:1px solid #D1D9F0; color:#1E3070; padding:10px 12px; border-radius:7px; font-size:12px; font-family:'Sora',sans-serif; outline:none;">
            <div onclick="app.syncNow()" style="background:#1D4ED8; color:#fff; padding:10px 16px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0;">${v.syncLabel}</div>
          </div>
        </div>

        <div style="margin-bottom:20px;">
          <div style="font-size:10px; color:#6B7CAF; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:7px;">📂 Import CSV — Email Helpdesk</div>
          <label style="display:block; background:#F5F7FF; border:1.5px dashed #A5B4D0; border-radius:7px; padding:16px; text-align:center; cursor:pointer; font-size:12px; color:#6B7CAF;">
            <input type="file" accept=".csv" onchange="app.importCsv(event)" style="display:none;">
            📋 Click to upload Email Helpdesk or Issue Tracker CSV
          </label>
        </div>

        <div style="margin-bottom:20px;">
          <div style="font-size:10px; color:#6B7CAF; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px;">📄 Report Details (used in Word export)</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div>
              <div style="font-size:10px; color:#9AA5C4; margin-bottom:4px;">Ref Number</div>
              <input id="refNumInput" type="text" placeholder="001/EHD/001/2026" value="${esc(v.refNum)}" oninput="app.onRef(event)" style="width:100%; background:#F5F7FF; border:1px solid #D1D9F0; color:#1E3070; padding:9px 10px; border-radius:7px; font-size:12px; font-family:'Sora',sans-serif; outline:none;">
            </div>
            <div>
              <div style="font-size:10px; color:#9AA5C4; margin-bottom:4px;">From</div>
              <input id="fromInput" type="text" placeholder="Manager, Email Helpdesk CX" value="${esc(v.fromVal)}" oninput="app.onFrom(event)" style="width:100%; background:#F5F7FF; border:1px solid #D1D9F0; color:#1E3070; padding:9px 10px; border-radius:7px; font-size:12px; font-family:'Sora',sans-serif; outline:none;">
            </div>
            <div>
              <div style="font-size:10px; color:#9AA5C4; margin-bottom:4px;">Prepared By — Name</div>
              <input id="prepByInput" type="text" placeholder="e.g. Love Offei" value="${esc(v.prepBy)}" oninput="app.onPrepBy(event)" style="width:100%; background:#F5F7FF; border:1px solid #D1D9F0; color:#1E3070; padding:9px 10px; border-radius:7px; font-size:12px; font-family:'Sora',sans-serif; outline:none;">
            </div>
            <div>
              <div style="font-size:10px; color:#9AA5C4; margin-bottom:4px;">Prepared By — Title</div>
              <input id="prepTitleInput" type="text" placeholder="Manager, Email Helpdesk CX" value="${esc(v.prepTitle)}" oninput="app.onPrepTitle(event)" style="width:100%; background:#F5F7FF; border:1px solid #D1D9F0; color:#1E3070; padding:9px 10px; border-radius:7px; font-size:12px; font-family:'Sora',sans-serif; outline:none;">
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #E8EDF5; padding-top:16px; display:flex; justify-content:space-between; align-items:center;">
          <div style="font-size:11px; color:#9AA5C4;">${esc(v.statusMsg)}</div>
          <div onclick="app.resetData()" style="background:rgba(220,50,50,0.1); color:#DC2626; font-size:11px; font-weight:700; padding:8px 14px; border-radius:7px; cursor:pointer; border:1px solid rgba(220,50,50,0.25);">🗑 Reset Data</div>
        </div>
      </div>
    </div>
    ` : ''}

    ${v.showToast ? `
    <div style="position:fixed; bottom:24px; right:24px; background:#1E3070; border:1px solid #162660; border-radius:10px; padding:13px 18px; font-size:13px; color:#fff; box-shadow:0 8px 32px rgba(30,48,112,0.3); z-index:9999; max-width:340px; animation:toast-in 0.3s ease;">
      ${esc(v.toastMsg)}
    </div>
    ` : ''}

  </div>`;

  const root = document.getElementById('root');
  const focusedId = document.activeElement ? document.activeElement.id : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  root.innerHTML = html;
  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }
  window._lastVals = v;
}

// ============================================================
// APP (event handlers exposed globally, matches template onclick="app.x()")
// ============================================================
window.app = {
  goTab: (tab) => setState({ activeTab: tab }),
  openSettings: () => setState({ showSettings: true }),
  closeSettings: () => setState({ showSettings: false }),
  closeSettingsBg: (e) => { if (e.target === e.currentTarget) setState({ showSettings: false }); },
  importCsv: (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => processCSV(ev.target.result);
    reader.readAsText(file);
  },
  importMobileCsv: (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => processMobileCSV(ev.target.result);
    reader.readAsText(file);
  },
  syncNow: () => {
    const urlEl = document.getElementById('syncUrlInput');
    const url = (urlEl && urlEl.value) || state.settings.syncUrl;
    if (!url) { toast('⚠️ Enter a sync URL first'); return; }
    saveSetting({ syncUrl: url });
    syncFromUrl(url);
  },
  onSyncUrl: (e) => saveSetting({ syncUrl: e.target.value }),
  onRef: (e) => saveSetting({ ref: e.target.value }),
  onFrom: (e) => saveSetting({ from: e.target.value }),
  onPrepBy: (e) => saveSetting({ prepBy: e.target.value }),
  onPrepTitle: (e) => saveSetting({ prepTitle: e.target.value }),
  importLiveChatHourlyCsv: (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => processLiveChatHourlyCSV(ev.target.result);
    reader.readAsText(file);
    e.target.value = '';
  },
  submitLiveChat: () => submitLiveChatForm(),
  importAmbassadorXlsx: (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => processAmbassadorXlsx(ev.target.result);
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  },
  resetData: () => {
    if (!window.confirm('Reset all imported data?')) return;
    try { localStorage.removeItem('ehd_liveData'); localStorage.removeItem('ehd_mobileData'); localStorage.removeItem('ehd_liveChatData'); localStorage.removeItem('ehd_ambassadorData'); } catch (e) {}
    setState({ liveData: null, mobileData: null, liveChatData: null, ambassadorData: null });
    toast('Data cleared');
  },
  exportWord: () => doExportWord(window._lastVals)
};

// ============================================================
// INIT
// ============================================================
loadPersisted();
render();
</script>
</body>
</html>
