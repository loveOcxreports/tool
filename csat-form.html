  .head img{width:42px;height:42px;border-radius:50%;display:block}
  .brand{font-weight:800;font-size:17px;margin:0}
  .brand-sub{font-size:12.5px;color:var(--ink-soft);margin:1px 0 0}
  .ribbon{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;
    background:var(--green-bg);border-top:1px solid var(--green-line);border-bottom:1px solid var(--green-line)}
  .ribbon b{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--green)}
  .ribbon span{font-family:"Courier New",monospace;font-weight:700;font-size:13px;color:var(--green)}
  .body{padding:22px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 6px}
  .issue{font-size:19px;font-weight:800;margin:0 0 4px}
  .who{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px}
  .who b{color:var(--ink)}
  .rate{border:1px solid var(--line);background:#F8FAFC;border-radius:14px;padding:20px 16px 16px;text-align:center;margin-bottom:22px}
  .rate h3{font-size:16.5px;font-weight:800;margin:0 0 4px}
  .rate p{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
  .stars{display:flex;justify-content:center;gap:4px}
  .stars button{background:none;border:0;padding:4px;cursor:pointer;color:var(--star-off);transition:color .12s,transform .12s}
  .stars button:hover{transform:scale(1.08)}
  .stars button.on{color:var(--gold)}
  .stars button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
  .stars svg{width:36px;height:36px;display:block}
  .word{min-height:20px;font-size:13.5px;font-weight:700;color:var(--ink);margin:8px 0 4px}
  .scale{font-size:11px;color:var(--muted);margin:0}
  label.more{display:block;font-size:14px;font-weight:700;margin:0 0 8px}
  label.more span{font-weight:500;color:var(--muted)}
  textarea{width:100%;min-height:80px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
    font:inherit;font-size:14.5px;color:var(--ink);margin-bottom:16px}
  textarea:focus{outline:none;border-color:var(--ink)}
  textarea::placeholder{color:var(--muted)}

<script>
(function(){
  var FLOW_URL = "https://defaultb841de22e0c340c5b3fec287594b46.49.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/7b8bd670e665432a948fa7fe100e9036/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=SsW3cJyu5K9tNmlvUEKC8QghuX344AH7sq1gAkHbyzM";

  var qs = new URLSearchParams(location.search);
  var ticketNumber = qs.get('ticket') || qs.get('ticketNumber') || '';
  var customer     = qs.get('customer') || '';
  var issueTitle   = qs.get('issue') || qs.get('issueTitle') || '';
  var district     = qs.get('district') || '';
  var preStars     = parseInt(qs.get('stars'), 10);

  var app = document.getElementById('app');
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  if(!ticketNumber){
    app.innerHTML = '<div class="missing"><h2>This link looks incomplete</h2>' +
      '<p>We couldn\'t find a ticket number in this link. Please use the feedback link from your email.</p></div>';
    return;
  }

  var words = {1:'Poor',2:'Below expectations',3:'Okay',4:'Good',5:'Excellent'};

  app.innerHTML =
    '<div class="ribbon"><b>&#9989; TICKET RESOLVED</b><span>#' + esc(ticketNumber) + '</span></div>' +
    '<div class="body">' +
      '<p class="eyebrow">YOUR COMPLAINT</p>' +
      '<p class="issue">' + esc(issueTitle || 'Your complaint') + '</p>' +
      (customer ? '<p class="who">Resolved for <b>' + esc(customer) + '</b></p>' : '<p class="who"></p>') +
      '<form id="f">' +
        '<div class="rate">' +
          '<h3>How did we do?</h3>' +
          '<p>Tap a star to rate your experience.</p>' +
          '<div class="stars" id="stars" role="radiogroup" aria-label="Rating">' +
            [1,2,3,4,5].map(function(n){
              return '<button type="button" data-n="'+n+'" role="radio" aria-checked="false" aria-label="'+n+' star'+(n>1?'s':'')+'"><svg><use href="#star"/></svg></button>';
            }).join('') +
          '</div>' +
          '<p class="word" id="word">&nbsp;</p>' +
          '<p class="scale">1 = Poor · 5 = Excellent</p>' +
        '</div>' +
        '<label class="more" for="comment">Want to tell us more? <span>(optional)</span></label>' +
        '<textarea id="comment" placeholder="Anything you\'d like to add?"></textarea>' +
        '<button type="submit" class="send" id="send" disabled>Send feedback</button>' +
        '<p class="status" id="status"></p>' +
      '</form>' +
    '</div>';

  var btns = Array.prototype.slice.call(document.querySelectorAll('#stars button'));
  var word = document.getElementById('word');
  var send = document.getElementById('send');
  var selected = 0;

  function paint(n){
    btns.forEach(function(b){
      var v = +b.getAttribute('data-n');
      b.classList.toggle('on', v <= n);
      b.setAttribute('aria-checked', v === selected ? 'true' : 'false');
    });
  }
  function choose(n){ selected = n; paint(n); word.textContent = words[n]; send.disabled = false; }

  btns.forEach(function(b){
    var n = +b.getAttribute('data-n');
    b.addEventListener('mouseenter', function(){ paint(n); word.textContent = words[n]; });
    b.addEventListener('mouseleave', function(){ paint(selected); word.innerHTML = selected ? words[selected] : '&nbsp;'; });
    b.addEventListener('click', function(){ choose(n); });
  });

  if(preStars >= 1 && preStars <= 5) choose(preStars);

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    if(!selected || send.disabled) return;
    send.disabled = true; send.textContent = 'Sending…';
    var st = document.getElementById('status'); st.textContent=''; st.className='status';

    var payload = {
      ticketNumber: ticketNumber,
      stars: selected,
      comment: document.getElementById('comment').value.trim(),
      customer: customer,
      issueTitle: issueTitle,
      district: district
    };

    fetch(FLOW_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function(res){
        if(!res.ok) throw new Error('bad status');
        app.innerHTML =
          '<div class="ribbon"><b>&#9989; TICKET RESOLVED</b><span>#' + esc(ticketNumber) + '</span></div>' +
          '<div class="thanks"><div class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
          '<h2>Feedback received</h2>' +
          '<p>Thank you' + (customer ? ', ' + esc(customer.split(' ')[0]) : '') + '. This helps us serve you better.</p></div>';
      })
      .catch(function(){
        send.disabled = false; send.textContent = 'Send feedback';
        st.textContent = 'Something went wrong sending your feedback. Please try again.'; st.className = 'status error';
      });
  });
})();
</script>
</body>
